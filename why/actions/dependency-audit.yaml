purpose: >-
  Judge the results of any number of dependency scans in one place: render them, fail from a chosen severity and
  keep the reports.
problem: >-
  If each repository judged its own scan, audits would be incomparable, a scan that could not complete could look
  like a clean result, and findings of unknown severity could slip through.
value: >-
  Every audit has the same report, the same summary and the same meaning of success, whichever ecosystems a
  repository scans.
principles:
  - principle: predictability
    how: A scan that cannot complete is a technical error and never a clean result, no report at all is an error, and findings of unknown severity always fail.
  - principle: consistency
    how: One report format, one summary and one failure rule for all ecosystems and repositories.
  - principle: stability
    how: The threshold is an input without a default, so the repository states it and it cannot drift.
  - principle: frugality
    how: It needs Python only, because it judges recorded files and runs no scanner.
steps:
  - step: Judge the reports, then upload them even if the judgement failed.
    why: The report of a failed audit is the one that has to be looked at.
decisions:
  - decision: The report action knows no ecosystem. It reads the report files that the audit actions recorded, whichever they are.
    why: A central action that knows each ecosystem needs a new input and a new case for every scanner, and a repository with an unsupported one has to leave the standard.
    rejected: One action with an input per ecosystem and its scanners inside.
  - decision: The interface between audit and report is a report file per scan in one directory, with a schema version.
    why: A file needs no wiring in the workflow, survives a failed step and lets a repository add a scan by adding a step. The version lets a report refuse a format it does not know when actions are pinned to different commits.
    rejected: Step outputs that name each report.
  - decision: Scanning and judging are separate steps with the report files between them.
    why: A scan can fail technically, and the judgement of findings must be possible from the files alone.
  - decision: The failure threshold is a required input, and unknown severity always fails.
    why: A repository decides deliberately which findings it accepts, and an unknown severity cannot be accepted by a threshold.
  - decision: A scan that is not recorded does not exist for the report, so a report without any scan fails.
    why: A repository must never pass by scanning nothing; whoever audits nothing states that by having no audit workflow.
out_of_scope:
  - description: Scanning, and installing the scanner tools.
    owner: the audit actions and the repository's workflow
  - description: Scheduling the audit and deciding which findings matter beyond the threshold.
    owner: the repository
  - description: Whether the repository scans every ecosystem it has.
    owner: the dependency-audit-workflow rule
limitations:
  - It cannot tell that a scan was forgotten, only that none was recorded or that a recorded one failed.
  - The result depends on the vulnerability data at the time of the run.
placement: >-
  The meaning of success and the report have to be the same for all repositories, while the ecosystems, the
  schedule and the threshold differ.
revisit_when:
  - >-
    A repository needs a scan that no audit action covers. It writes the report file itself, and an action is
    added only when several repositories repeat it.
inputs:
  fail-on: The lowest severity that fails the run; the repository states it.
  extra-report-paths: Further files that are uploaded with the reports and never judged, such as a scanner's own HTML report.
requirements:
  Python: The tooling is a Python program using only the standard library.
references:
  - actions/dependency-audit/README.md
  - docs/security.md
