purpose: >-
  Push the verified candidate images to the container registry of GitHub and publish the planned release
  without files.
problem: >-
  Publishing images by rebuilding them, or by pushing before the release is certain, can put an untested
  image under a version tag, or leave a registry with images of a release that was never created.
value: >-
  The registry receives exactly the verified candidate images, tagged with the planned version only when the
  release proceeds.
principles:
  - principle: predictability
    how: The archives are verified before anything is loaded or pushed, and the pushed digest is compared with the candidate.
  - principle: reproducibility
    how: Images are loaded from the verified archives, and nothing is built at publication.
  - principle: consistency
    how: Every repository that ships images publishes them the same way.
  - principle: frugality
    how: The names are read from the receipt, so the list exists once, and the login uses the job token.
steps:
  - step: Log in to the registry with the job token.
    why: The login belongs to the pushing step, so no repository handles registry credentials.
  - step: Read the image names from the candidate's receipt.
    why: The list was given once, to the export, and a second copy could differ from it.
  - step: Load the verified images before the tag exists, push the version and the latest tags after it, and compare digests.
    why: >-
      Loading first proves that the archives are loadable before the release is created. Pushing after the tag
      means the registry gets images only for a release that exists.
decisions:
  - decision: The image names are read from the receipt that the export wrote and that the evidence bound.
    why: A second list in the publishing job could differ from the first, and the receipt is already verified.
  - decision: Images are published with official releases only.
    why: The latest tag must move only for official releases, and a development prerelease is not meant to be pulled.
  - decision: The pushed image is compared with the candidate by its configuration digest.
    why: A registry or a tag that points to something else is the failure that this action exists to catch.
  - decision: The release is created without files.
    why: The images are the release; files would be a second artifact with a second verification.
supported_variations:
  - requirement: A repository ships one image or several.
    why: The names come from the receipt, so the number does not matter.
out_of_scope:
  - description: Building, testing and exporting the images.
    owner: the candidate job and export-image
  - description: Publishing files.
    owner: publish-release
limitations:
  - It publishes to one registry, the one of the platform the repository lives on.
placement: >-
  Publishing images safely has to be done the same way everywhere, and the order of load, tag and push is the
  part that is easy to get wrong in each repository.
revisit_when:
  - A new registry is required. It is weighed centrally and added as another publication action that shares the common library, unless it is a real edge case.
  - >-
    A new requirement would need one more input. It is first weighed: unless it is a real edge case, it is
    solved here once instead of in a repository.
inputs:
  version: The planned version, so that publication can compare it with the recalculated one.
  force: Must equal the plan's value, because a forced plan has no releasable commit that publication could find.
requirements:
  Node: The tooling is a Node program, so Node has to be on the path.
  Docker: The job loads and pushes images.
  packages write: The caller grants it, because pushing to the registry needs it.
references:
  - actions/release/README.md
