purpose: >-
  Verify, in the candidate job of one platform, the container images that the job built as archives, so that
  nothing but a complete and well-formed platform candidate reaches the evidence.
problem: >-
  An image that is not what the release planned, built for another platform, labeled with another version or
  source, or without its provenance and SBOM, would only be noticed when publication assembles the platforms,
  after the whole candidate was built.
value: >-
  A candidate job fails early and on its own platform when its images are not the planned ones, and everything the
  evidence records has been checked once already.
principles:
  - principle: predictability
    how: Each archive is verified against the planned version and source, and the job states exactly which platform it was for.
  - principle: reproducibility
    how: The archives are the candidate; they are recorded by the evidence and published unchanged, and nothing is rebuilt.
  - principle: consistency
    how: Every repository that ships images names its archives the same way and builds them with the same labels and attestations.
  - principle: frugality
    how: The inputs are the version, the target and the list of images, and the rest is derived.
steps:
  - step: Check that the output directory holds exactly the archives of the target, one per image.
    why: Anything left over would be treated as part of the candidate, and a missing archive would surface only at publication.
  - step: Verify each archive as the image index of the target's one platform, with its labels and its provenance and SBOM attestations.
    why: The checks that publication repeats on the assembled index are made here once on each platform, where the job can still fail alone.
decisions:
  - decision: Every platform builds its own candidate as an OCI archive `dist/<name>-<target>.tar`.
    why: >-
      Platforms are built on native runners in parallel, which is much faster than emulating one, and an OCI archive
      keeps the provenance and SBOM attestations that a Docker image archive loses.
    rejected: One job that builds all platforms by emulation. It is simple but slow for every compiled language.
  - decision: The archives are not pushed from the candidate job.
    why: >-
      Pushing in the candidate job would publish before the candidate is verified as a whole, before readiness
      and before the tag exists.
    rejected: Pushing a candidate tag per platform and merging in the registry. It would put unverified images into a registry.
  - decision: The platform of the archive must match its target, and the targets are linux-amd64 and linux-arm64.
    why: A wrong platform under a right name is the mistake that a matrix of jobs makes easy.
supported_variations:
  - requirement: A repository ships one image or several.
    why: The input is a list, and every image has an archive per target.
out_of_scope:
  - description: Building and testing the images, including a smoke test of the running image.
    owner: the candidate job, which runs the repository's release-point rules natively on every platform
  - description: Assembling the platforms into one index, and pushing and tagging.
    owner: publish-image
limitations:
  - It supports linux/amd64 and linux/arm64.
placement: >-
  The archive format is the contract between the candidate jobs and publication, so it has to be defined once.
revisit_when:
  - An image has to be shipped for another platform. It is weighed centrally, since the targets and the assembly change.
  - >-
    A new requirement would need one more input. It is first weighed: unless it is a real edge case, it is
    solved here once instead of in a repository.
inputs:
  version: The planned version, which the labels must carry.
  target: The candidate target of the job, linux-amd64 or linux-arm64.
  images: The names of the images that the job built, one per line; there is no other source of this list.
requirements:
  Python: The tooling is a Python program using only the standard library.
references:
  - actions/release/README.md
