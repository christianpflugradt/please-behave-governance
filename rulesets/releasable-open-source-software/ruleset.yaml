purpose: >-
  Add to an open-source repository the uniform way of starting releases: one release task.
audience: >-
  Open-source software repositories of the catalog owner that publish releases.
commonality: >-
  Release policy, version calculation and publication are carried out by the shared release
  action and workflow, so that releases behave the same in every repository. What remains
  in the repository is the command that starts a release, the call of the shared workflows
  and actions in a fixed flow, and what the candidate builds and verifies.
rules:
  - rule: mise-release
    role: Fixes the command that starts a release.
  - rule: release-workflow
    role: Fixes the flow of the release workflow and its calls of the shared workflows and actions.
admission:
  - The rule concerns publishing releases and applies only to repositories that publish them.
  - It standardizes where there is no legitimate interest in deviating per repository.
  - It checks structure or configuration and does not dictate what is built or verified.
  - It does not repeat a rule of another set.
excluded:
  - description: Repositories without releases.
    rationale: The rules would demand a release machinery they do not use.
  - description: Release policy and what is built, tested and verified in a release.
    rationale: The shared release action and workflow own the policy; build and verification stay local.
complements:
  - ruleset: open-source-software
    rationale: Releases are published by open-source repositories, which this set builds on.
  - ruleset: repository-conventions
    rationale: The commit conventions it defines drive the release levels.
  - ruleset: security
    rationale: It adds the security policy, including pinned actions, to the release workflow.
execution_points: >-
  The rule runs at check and pre-push, so that deviations are noticed before they are
  published and CI checks again.
references:
  - docs/releases.md
