purpose: >-
  Bundle the lightweight baseline that every repository should have, regardless of its kind or visibility.
audience: >-
  All repositories, public or private, software or not, such as documentation or
  personal coaching.
commonality: >-
  Each rule records a baseline that holds for every repository: shared formatting,
  a uniform commit history, the same basic commands, continuous updates, a lean,
  usable AGENTS.md and workflows and shell scripts that are free of syntax mistakes.
  They can be evaluated locally. A repository that owns rules also needs a way to publish their metadata.
rules:
  - rule: editorconfig
    role: Fixes the shared formatting baseline.
  - rule: commit-message
    role: Keeps the history in a uniform, machine-readable format.
  - rule: commit-message-quality
    role: Makes the description say something, as advice.
  - rule: mise-baseline
    role: Gives every repository the same basic commands and a fixed governor version.
  - rule: mise-setup
    role: Gives every repository the same way to set up a checkout.
  - rule: renovate-baseline
    role: Keeps pins and dependencies up to date automatically.
  - rule: workflow-syntax
    role: Finds mistakes in GitHub workflows, which almost every repository has, before the push.
  - rule: rule-registration-workflow
    role: Checks that GitHub repositories with their own rules can register committed versions.
  - rule: shell-scripts
    role: Keeps shell scripts, which almost every repository has, portable and free of typical mistakes.
  - rule: format-shell
    role: Keeps shell scripts formatted with shfmt so that style is uniform without review.
  - rule: agents-size
    role: Keeps AGENTS.md small.
  - rule: agents-quality
    role: Checks that AGENTS.md gives usable guidance, as advice.
admission:
  - The rule applies to every repository, regardless of software, visibility or technology.
  - It works through Git hooks alone, without CI, and stays lightweight.
  - It records a baseline and does not dictate the choice of tools; a rule that merely passes one command to local tooling stays local, unless nearly every repository has the matter regardless of any technology decision, as with workflows and shell scripts.
  - It does not duplicate another rule of the set.
excluded:
  - description: Licenses and the structure of CI and statistics workflows.
    rationale: They concern only open-source repositories.
    ruleset: open-source-software
  - description: Security checks.
    rationale: Security is its own domain with its own bundle.
    ruleset: security
  - description: Formatters and linters as rules.
    rationale: They are a choice of tools and stay local in each repository.
complements:
  - ruleset: open-source-software
    rationale: Adds what only open-source repositories need on top of the baseline.
  - ruleset: private-repositories
    rationale: Adds what private repositories need on top of the baseline.
  - ruleset: security
    rationale: Adds the security policy on top of the baseline.
execution_points: >-
  The rules run at pre-commit and check, so that they work through Git hooks alone
  and CI repeats the same checks. The two commit rules run at commit-msg because the
  message they judge exists only there. The review of AGENTS.md runs only at check
  to avoid the cost of model calls. Registration setup is checked at check to keep commit hooks short.
references:
  - docs/repository-conventions.md
