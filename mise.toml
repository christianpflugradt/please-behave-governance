include = [
  "rulesets/repository-conventions/mise.toml",
  "rulesets/security/mise.toml",
  "rulesets/open-source-software/mise.toml",
  "rulesets/why/mise.toml",
]

[tools]
"github:please-behave/cli" = "0.25.0"
python = "3.15.2"
node = "26.13.1"
ruff = "0.17.5"

[tasks.setup]
description = "Install the locked release action dependencies"
run = "npm ci --ignore-scripts --prefix actions/release"

[tasks.format]
description = "Format Python and shell sources"
run = ["ruff format", "git ls-files -z '*.sh' | xargs -0 -r shfmt -w"]

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"
