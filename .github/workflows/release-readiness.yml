name: Release readiness

on:
  workflow_call:
    inputs:
      source-sha:
        description: The commit planned for the release
        type: string
        required: true
      required-jobs:
        description: Newline-separated names of the CI jobs that must have succeeded, including every matrix entry
        type: string
        default: Check
    outputs:
      ci_run_id:
        description: The CI run that proved the source commit
        value: ${{ jobs.readiness.outputs.ci_run_id }}
      ci_attempt:
        description: The attempt of that run in which the first required job succeeded
        value: ${{ jobs.readiness.outputs.ci_attempt }}

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  readiness:
    name: Readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.proof.outputs.ci-run-id }}
      ci_attempt: ${{ steps.proof.outputs.ci-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python
      - name: Verify exact-source CI prerequisites
        id: proof
        uses: christianpflugradt/please-behave-governance/actions/release/check-ci@e0d645d4cf3d5e462540eb184ee55b5ad7227889 # updates/actions/release
        with:
          required-jobs: ${{ inputs.required-jobs }}
