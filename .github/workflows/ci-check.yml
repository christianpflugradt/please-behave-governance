name: CI check

on:
  workflow_call:
    inputs:
      runner:
        description: The runner image the checks run on
        type: string
        default: ubuntu-26.04
      env:
        description: Further environment variables for the setup and the checks, one NAME=value per line
        type: string
        default: ''
    secrets:
      GEMINI_API_KEY:
        description: Key of the model API that the reviews use; without it the reviews cannot run
        required: false

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: 'false' # Install tools explicitly before running tasks.

jobs:
  check:
    name: Check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export environment variables
        if: inputs.env != ''
        env:
          VARIABLES: ${{ inputs.env }}
        run: |
          set -euo pipefail
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            if ! [[ "$line" =~ ^([A-Za-z_][A-Za-z0-9_]*)=(.*)$ ]]; then
              echo "::error::Invalid environment line, expected NAME=value" >&2
              exit 1
            fi
            case "${BASH_REMATCH[1]}" in
              PATH | BASH_ENV | NODE_OPTIONS | GITHUB_* | RUNNER_* | LD_* | DYLD_*)
                echo "::error::The variable ${BASH_REMATCH[1]} must not be set" >&2
                exit 1
                ;;
            esac
            echo "$line" >>"$GITHUB_ENV"
          done <<<"$VARIABLES"
      - name: Install project tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Fetch locked dependencies
        run: mise run setup
      - name: Trust the shared governance repository
        run: please trust https://github.com/christianpflugradt/please-behave-governance.git
      - name: Run Please Behave checks
        uses: please-behave/action@98c72fdf0ff5c1a9ec5b815c07b1a38745e50bc3 # v1.5.2
        with:
          install: 'false'
          sync: 'true'
          execution-point: check
          summary: 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-check
          path: .please/reports/last.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
