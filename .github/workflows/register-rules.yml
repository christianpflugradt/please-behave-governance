name: Register rules

on:
  push:
    branches: [main]
    paths:
      - '.please/checks/**/rule.toml'
      - '.please/checks/**/rule.yaml'
      - 'rules/checks/**/rule.toml'
      - 'rules/checks/**/rule.yaml'
      - 'rules/reviews/**/rule.toml'
      - 'rules/reviews/**/rule.yaml'
      - 'rules/reviews/**/prompt.md'
      - '.please/config.toml'
      - '.github/workflows/register-rules.yml'
      - '.github/workflows/rule-registration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.sha }}
  cancel-in-progress: true

jobs:
  register:
    uses: ./.github/workflows/rule-registration.yml
    secrets:
      GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
      GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
