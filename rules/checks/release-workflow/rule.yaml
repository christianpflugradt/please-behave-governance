purpose: >-
  Keep every release workflow in the same shape: the shared plan and readiness workflows, a candidate job
  that runs in parallel to readiness, and one publish job.
problem: >-
  The release machinery lives once in the governance repository. Nothing stops a repository from putting its
  own Semantic Release configuration, CI proof or publication steps back next to it, so that releases behave
  differently again and the duplication returns unnoticed.
value: >-
  A repository that deviates from the standard flow is told at pre-push, before a release is attempted, and
  each release looks the same in the Actions view of every repository.
conditions:
  - statement: .github/workflows/release.yml exists, is called Release, runs on workflow_dispatch and never on push or pull requests.
    rationale: Releases start deliberately, and a workflow that reacts to pushes would publish without anyone deciding to.
  - statement: The workflow has exactly the jobs plan, release-readiness, release-candidate and publish.
    rationale: One recognizable flow lets people and agents find the same job in every repository.
  - statement: plan and release-readiness call the shared workflows release-plan.yml and release-readiness.yml, pinned to a full commit SHA.
    rationale: Version calculation and the proof of CI exist once, and a pinned reference cannot change under a repository.
  - statement: release-readiness and release-candidate need only plan, so that they run in parallel.
    rationale: The proof of CI and the build of the candidate do not depend on each other, and sequencing them would only delay releases.
  - statement: release-candidate runs the shared governance action and records the candidate with the evidence action.
    rationale: The candidate is checked at the release point and bound to its source and version, whatever the repository builds.
  - statement: publish needs plan, release-readiness and release-candidate, verifies the evidence and publishes exactly once with publish-release or publish-image.
    rationale: Only a complete and verified candidate is published, as files or as images, and never both ways at once.
  - statement: Steps must not run Semantic Release themselves, and release.config.*, .releaserc* and a release key in package.json do not exist.
    rationale: The shared actions own the release policy, and a second one in the repository would silently take precedence.
  - statement: .github/release-artifacts.json is an object with root and a non-empty targets.
    rationale: The evidence action cannot bind a candidate without knowing its files.
success_criteria:
  - A missing job, a wrong dependency, a missing shared call or an unpinned governance reference fails with a message that names the part.
  - What the candidate job builds, tests or packages, and how, is never judged.
  - Invalid YAML or JSON is an ERROR and never a verdict.
out_of_scope:
  - description: Building, testing and packaging the candidate, which is the product's own work.
  - description: The inputs of the shared actions, which they validate themselves.
  - description: Whether the release ran or succeeded.
limitations:
  - Only structure is verified, so a candidate job that builds nothing still passes.
  - Matrix candidate jobs are allowed but not judged, so the matrix content is up to the repository.
placement: >-
  The flow is common to all repositories that release through the shared machinery, while the candidate
  content differs per product; sharing the structure and leaving the content local keeps releases uniform
  without dictating what a product builds.
parameters: {}
references:
  - actions/release/README.md
  - docs/releases.md
