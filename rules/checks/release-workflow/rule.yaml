purpose: >-
  Give every repository that publishes releases the same secure release workflow, in which a release is planned, checked and only then published.
problem: >-
  A release workflow has write permissions and publishes. Without a fixed structure,
  a release can be published without verification, from a different state than
  planned, or from a run that only partly succeeded. Workflows built individually
  drift apart, and releases then behave in surprising ways.
value: >-
  Every release passes the same stages everywhere: plan, readiness, candidate and
  publication. It is published only when all stages succeeded, only from main, and
  always from the planned state. A release rhythm, release channels and manual
  snapshots are supported by the structure, without any repository having to use them.
conditions:
  - statement: The workflow is named Release and runs on manual dispatch and optionally on a schedule, never on push or pull requests.
    rationale: A release is built deliberately, either manually or on a schedule, and not after every push. A schedule gives a fixed rhythm in which nothing is built when nothing is new, while dependency updates that Renovate merged still flow into a patch release.
  - statement: Top-level permissions are exactly contents read, and only the jobs plan and publish may grant write permissions.
    rationale: Only these jobs need them.
  - statement: The concurrency group is release-main and does not cancel runs in progress.
    rationale: A running release must not be aborted and two releases must not run at the same time.
  - statement: Automatic mise installation is off and every mise setup step names its tools.
    rationale: Every job installs only what it needs.
  - statement: The jobs plan, release-readiness, release-candidate and publish exist.
    rationale: They are the shared stages. Readiness holds the checks that do not depend on the candidate, such as a passed CI run for the commit, which would give the same result for every candidate. A candidate is a build for one target environment, such as an operating system, a runtime or a processor architecture, and its checks prove that the release can be built there.
  - statement: plan runs only on main, reports release, version and source commit and runs the release planning.
    rationale: The plan decides centrally whether and what is released.
  - statement: Every other job needs plan and runs only when a release is planned.
    rationale: Without a release there is nothing to verify.
  - statement: publish needs every other job, runs only when each of them succeeded and ends with the release.
    rationale: Publication happens only after complete verification.
  - statement: Checkout does not persist credentials and every job except plan checks out the planned source commit.
    rationale: All stages must verify exactly the state that was planned.
  - statement: publish uses the Please Behave action at the release execution point.
    rationale: The release checks form the last hurdle before publication.
  - statement: Every job sets a timeout.
    rationale: A hanging job must not consume minutes unnoticed.
success_criteria:
  - A deviating structure fails and the message names the violated part.
  - Scripts and their locations, evidence, candidate and smoke steps, runners and matrices are free and never cause a FAIL.
  - A missing tool or invalid YAML is an ERROR.
out_of_scope:
  - description: Whether CI succeeded for the released commit.
  - description: Pinning of actions to commit hashes.
    owner: workflow-action-pins
  - description: Syntax and expressions of the workflow.
    owner: workflow-syntax
  - description: The release configuration.
    owner: semantic-release
limitations:
  - Only the structure is verified, so it is not known whether the candidate is meaningfully tested.
  - A stage whose content does not match its name is not detected; if a checked matter does not fit the readiness stage, the stage should be renamed.
placement: >-
  The structure is the same for all repositories that publish releases, so that a
  release holds no surprise and the workflows do not drift. Scripts and what is
  verified stay local, so release scripts can move to another repository.
references:
  - docs/releases.md
