id = "dependency-audit-workflow"
version = "1.0"
name = "Dependency audit workflow"
description = "The Dependency Audit workflow follows the shared standard structure, or the repository has no known dependency manifest"
enabled = true

[check]
command = "python3 @rule/check.py @context @param/dependencies @rule/manifests.txt"
timeout_seconds = 60

[parameters.dependencies]
type = "string"
required = true
description = "audited when the repository has dependencies and audits them in dependency-audit.yml, or none when it has no dependency manifest"
