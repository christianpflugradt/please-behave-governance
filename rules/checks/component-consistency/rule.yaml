purpose: Keep the component map and the requirement areas consistent with the source code.
problem: >-
  Components describe the current implementation. Without a check, ownership of
  files and declared dependencies drift away from the code unnoticed, and
  requirements lose the grouping that makes them navigable.
value: The component map stays complete and current, and every requirement can be found by its area.
conditions:
  - statement: Every file below a declared source root, except test files, and every file the Rust sources embed at compile time belongs to exactly one component.
    rationale: Ownership must be complete and unambiguous, and the compiled product is what components describe.
  - statement: Every file a component lists exists and belongs to that compiled product.
    rationale: A listed file that is not compiled is stale or misplaced.
  - statement: For components that own Rust modules, the declared dependencies match the dependencies observed in the source, in both directions.
    rationale: An undeclared dependency hides coupling, and a declared but unused one is stale.
  - statement: Every requirement declares a non-empty area.
    rationale: The repository groups its requirements by area, and an ungrouped requirement is easily overlooked.
success_criteria:
  - Every violation fails the Rule and is listed individually.
  - A repository that declares no source roots passes without any check.
  - An invalid source root, a missing helper tool or any other technical failure is an ERROR.
  - Mutual dependencies between components are reported as a note and do not fail.
out_of_scope:
  - description: The structure of component and requirement files and whether their references resolve.
    owner: why-artifacts
  - description: Whether the content of requirements and decisions is meaningful, and which areas a repository uses.
  - description: Dependencies of code that is not Rust. Such files are checked for ownership only.
  - description: Test files, recognized by the directories tests and __tests__ and the names tests.rs, *_test.rs, *_tests.rs, *.test.* and *.spec.*.
limitations:
  - Dependencies are derived from crate and library path references with regular expressions, and test code after the first test configuration attribute is ignored.
  - Embedded files come from include_str!, include_bytes! and sqlx::migrate!, which embeds the .sql files of the migrations directory next to the nearest Cargo.toml. A file generated by a build step must exist when the check runs.
  - Only a main.rs directly below a source root may use the library crate by name.
placement: >-
  Repositories that document with Why and contain code share the structure of components and
  requirement areas, while where their code lives and which language it uses is declared per repository
  through the source roots. It sits in its own ruleset because the Rule needs the source_roots parameter, which
  repositories without code, such as documentation, would otherwise have to set too.
