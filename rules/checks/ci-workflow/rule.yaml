purpose: >-
  Give every open-source repository a uniformly structured CI that repeats the governance checks independently of local hooks.
problem: >-
  Local Git hooks can be bypassed or missing, for example when they were never
  installed or when a push is retried after a rebase without verifying again. A
  violation then reaches main without any check having run. What happens on a
  developer's machine is also invisible to others, and a result that only holds
  on that machine says little. Differently built CI workflows are hard to survey
  and often carry unneeded permissions.
value: >-
  The checks are repeated in every case, transparently and from a neutral
  environment, and every repository does so in a recognizable, minimally
  privileged form.
conditions:
  - statement: .github/workflows/ci.yml is named CI and runs on push to main and on pull requests.
    rationale: Every change that reaches or wants to reach main is verified. Further triggers are allowed.
  - statement: Top-level permissions are exactly contents read.
    rationale: Checking needs no write access.
  - statement: A job check with a timeout contains, in this order, checkout without persisted credentials, mise setup, the setup task and the Please Behave action at the check execution point.
    rationale: This is the shared sequence in which tools are installed, dependencies fetched and the checks run.
  - statement: Every job sets a timeout.
    rationale: A hanging job must not consume minutes unnoticed.
success_criteria:
  - A missing or deviating structure fails and the message names the violated part.
  - Runners, matrices, timeout values, additional jobs and steps, secrets and artifact names are free and never cause a FAIL.
  - A missing tool or invalid YAML is an ERROR.
out_of_scope:
  - description: Whether CI actually ran or passed.
  - description: Syntax and expressions of the workflow.
    owner: workflow-syntax
  - description: Pinning of actions to commit hashes.
    owner: workflow-action-pins
  - description: All other workflows.
limitations:
  - Only the structure is verified, so a CI that runs but does nothing useful still passes.
placement: >-
  The structure is the same for all open-source repositories and needs no project
  knowledge. Runners and additional steps remain local.
references:
  - docs/open-source-software.md
