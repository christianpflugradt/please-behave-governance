purpose: >-
  Give private repositories a lean CI that runs on pull requests and on main and bounds the Actions minutes it can use.
problem: >-
  Private repositories share a monthly allowance of free Actions minutes. A CI that
  runs on every branch or on triggers beyond pull requests and main pays for checks
  nobody needs. The state of main must still be checked and attested, because it is
  what counts. Unbounded jobs, matrices and superseded runs consume further minutes. Once the
  allowance is used up, pull requests of dependency updates remain without a check.
value: >-
  Every private repository has a CI for pull requests and for main and stays predictably within
  the free allowance.
conditions:
  - statement: .github/workflows/ci.yml is named CI and runs on pull requests and on push to the branch main only, optionally on manual dispatch, never on another branch, schedule or any other event.
    rationale: The state of main is checked and attested; runs on other branches or events would only consume minutes.
  - statement: Top-level permissions are exactly contents read.
    rationale: Checking needs no write access.
  - statement: Concurrency cancels runs in progress.
    rationale: A pull request superseded by a force push must not keep billing minutes for old runs.
  - statement: A job check calls the shared workflow ci-check-private.yml pinned to a full commit SHA, with no steps of its own and only optional gateway secrets. It may pass GATEWAY_URL with or without GATEWAY_KEY. The shared workflow runs the checks only and limits the job to 5 minutes.
    rationale: Reviews are advisory and call a paid model API, so they stay out of CI, and the sequence of the checks exists once, together with its timeout.
  - statement: An input runner, if set, names a versioned runner and no job uses a matrix.
    rationale: A fixed version makes runner changes reviewable, since Renovate proposes new versions, and a matrix multiplies the usage.
success_criteria:
  - A deviating structure fails and the message names the violated part.
  - Triggers beyond pull request, push to main and dispatch, additional jobs and the runner version are free and never cause a FAIL.
  - A missing tool or invalid YAML is an ERROR.
out_of_scope:
  - description: Whether the allowance suffices, because billing is not visible to the Rule.
  - description: Syntax and expressions of the workflow.
    owner: workflow-syntax
  - description: Pinning of actions to commit hashes.
    owner: workflow-action-pins
  - description: All other workflows.
limitations:
  - Only the structure is verified, not the actual usage; only the account's spending limit protects against exceeding the allowance.
placement: >-
  The restriction is the same for all private repositories. The timeout of the check
  is set once in the shared workflow, to 5 minutes.
references:
  - docs/private-repositories.md
