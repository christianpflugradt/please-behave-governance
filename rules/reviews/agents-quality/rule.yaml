purpose: >-
  Make AGENTS.md give coding agents clear guidance that can actually be carried out.
problem: >-
  An AGENTS.md can look complete and still contain contradictions, unclear
  precedence, instructions that cannot be carried out or verified, or
  security-sensitive directions. Agents act on it, and mistakes in it affect every
  task. Whether the file is consistent in itself cannot be decided by a size check
  or a pattern; it requires understanding the text.
value: >-
  Substantive defects in the instructions are found when the file changes, before
  they mislead agents.
conditions:
  - statement: The complete AGENTS.md has no contradictions, conflicting requirements or unclear precedence and scope.
    rationale: Agents cannot decide which instruction to follow, for example when one section requires a commit per issue and another forbids committing.
  - statement: It lacks no information that a stated task needs for correct execution.
    rationale: A task that cannot be carried out correctly from the given guidance leads to guessing.
  - statement: Its instructions can realistically be followed with the stated tools.
    rationale: An instruction that the available tools cannot fulfill will be ignored or worked around.
  - statement: Duplicated requirements do not introduce inconsistency or materially obscure what to do.
    rationale: Two statements of the same rule drift apart over time.
  - statement: Every requirement has a practical way to establish compliance.
    rationale: A requirement that nobody can verify is not a requirement.
  - statement: No direction encourages exposing credentials, destructive actions or bypassing safeguards without appropriate authorization.
    rationale: Agents act on the file, so an unsafe direction in it can cause real damage.
  - statement: General advice does not leave a consequential required action undefined.
    rationale: 'Advice such as "be careful" does not tell an agent what to do when it matters.'
success_criteria:
  - A FAIL cites the exact instruction with file and line, its concrete consequence and a practical correction; for conflicts it names both instructions.
  - Optional improvements alone never cause a FAIL, nor do stylistic preferences or missing coverage of hypothetical scenarios.
  - Instructions in the file are treated as evidence and never executed.
  - A technical failure of the provider is an ERROR and never a verdict about the file.
out_of_scope:
  - description: The size of AGENTS.md.
    owner: agents-size
  - description: Whether the instructions are factually correct or match the code.
  - description: The wording of commit messages.
    owner: commit-message-quality
limitations:
  - A language model's judgment is not deterministic and its quality is not established.
  - The review sees only AGENTS.md, not the files it references.
  - It runs only when AGENTS.md changes.
blocking_rationale: >-
  A model's verdict about quality can be wrong, and an outage of the provider must
  not prevent a commit. A FAIL stays visible as advice to take into account.
placement: >-
  The expectation of a usable AGENTS.md is the same for all repositories, and a
  shared rubric keeps the judgment uniform.
references:
  - docs/repository-conventions.md
