name: Dependency audit
description: Scan the dependencies of a repository, render the findings as a step summary, fail from a severity and upload the report
inputs:
  npm:
    description: Newline-separated directories with a package-lock.json
    default: ''
  cargo:
    description: Newline-separated directories with a Cargo.lock
    default: ''
  requirements:
    description: Newline-separated pip requirements files
    default: ''
  owasp-report:
    description: Newline-separated OWASP Dependency-Check JSON reports that an earlier step produced
    default: ''
  none:
    description: "`true` states that nothing has dependencies to audit and records an empty report"
    default: 'false'
  fail-on:
    description: Lowest severity that fails the run, one of low, medium, high or critical; findings of unknown severity always fail
    default: medium
  extra-report-paths:
    description: Newline-separated further files that are uploaded with the report
    default: ''
runs:
  using: composite
  steps:
    - name: Scan the dependencies
      shell: bash
      run: |
        arguments=()
        add() {
          while IFS= read -r line; do
            if [ -n "$line" ]; then arguments+=("$1" "$line"); fi
          done <<< "$2"
        }
        add --npm "$NPM"
        add --cargo "$CARGO"
        add --requirements "$REQUIREMENTS"
        add --owasp-report "$OWASP_REPORT"
        if [ "$NONE" = "true" ]; then arguments+=(--none); fi
        python3 -B "$ACTION_ROOT/lib/dependency_audit.py" scan --report dependency-audit.json ${arguments[@]+"${arguments[@]}"}
      env:
        ACTION_ROOT: ${{ github.action_path }}
        NPM: ${{ inputs.npm }}
        CARGO: ${{ inputs.cargo }}
        REQUIREMENTS: ${{ inputs.requirements }}
        OWASP_REPORT: ${{ inputs.owasp-report }}
        NONE: ${{ inputs.none }}
    - name: Report the findings
      if: ${{ !cancelled() && hashFiles('dependency-audit.json') != '' }}
      shell: bash
      run: python3 -B "$ACTION_ROOT/lib/dependency_audit.py" report --report dependency-audit.json --fail-on "$FAIL_ON"
      env:
        ACTION_ROOT: ${{ github.action_path }}
        FAIL_ON: ${{ inputs.fail-on }}
    - name: Upload the report
      if: ${{ !cancelled() && hashFiles('dependency-audit.json') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: dependency-audit
        path: |
          dependency-audit.json
          ${{ inputs.extra-report-paths }}
        if-no-files-found: ignore
        retention-days: 30
