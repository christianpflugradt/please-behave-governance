name: Dependency audit report
description: Render the recorded audit results as a step summary, fail from a severity and upload the reports
inputs:
  fail-on:
    description: Lowest severity that fails the run, one of low, medium, high or critical; findings of unknown severity always fail
    required: true
  extra-report-paths:
    description: Newline-separated further files that are uploaded with the reports and never judged
    default: ''
runs:
  using: composite
  steps:
    - name: Report the findings
      shell: bash
      run: python3 -B "$ACTION_ROOT/../lib/audit_report.py" report --fail-on "$FAIL_ON"
      env:
        ACTION_ROOT: ${{ github.action_path }}
        FAIL_ON: ${{ inputs.fail-on }}
    - name: Upload the reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: dependency-audit
        path: |
          ${{ runner.temp }}/dependency-audit
          ${{ inputs.extra-report-paths }}
        if-no-files-found: ignore
        retention-days: 30
