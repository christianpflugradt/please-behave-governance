name: Dependency audit for Cargo
description: Audit the Cargo.lock of one directory with cargo audit and record the result for the dependency audit report
inputs:
  directory:
    description: Directory with a Cargo.lock
    default: .
runs:
  using: composite
  steps:
    - name: Audit the Cargo dependencies
      shell: bash
      run: python3 -B "$ACTION_ROOT/../lib/cargo_audit.py" --directory "$DIRECTORY"
      env:
        ACTION_ROOT: ${{ github.action_path }}
        DIRECTORY: ${{ inputs.directory }}
