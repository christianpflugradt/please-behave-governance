name: Dependency audit for npm
description: Audit the package-lock.json of one directory with npm audit and record the result for the dependency audit report
inputs:
  directory:
    description: Directory with a package-lock.json
    default: .
runs:
  using: composite
  steps:
    - name: Audit the npm dependencies
      shell: bash
      run: python3 -B "$ACTION_ROOT/../lib/npm_audit.py" --directory "$DIRECTORY"
      env:
        ACTION_ROOT: ${{ github.action_path }}
        DIRECTORY: ${{ inputs.directory }}
