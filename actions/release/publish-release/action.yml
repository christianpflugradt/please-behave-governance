name: Publish release
description: Publish the planned release of a repository as a GitHub release with the shared release policy
inputs:
  version:
    description: The version planned by the plan action
    required: true
  mode:
    description: The mode that was planned
    default: release
  tag-format:
    description: Tag format of official releases
    default: v${version}
  force:
    description: Must equal the value given to the plan action
    default: 'false'
  assets:
    description: Newline-separated globs of the files attached to the release
    default: ''
  source-sha:
    description: The commit planned by the plan action, recorded with the release
    required: true
  gateway-url:
    description: Please Behave gateway origin, passed from a secret; without it the release is not recorded
    default: ''
runs:
  using: composite
  steps:
    - name: Install the release tooling
      shell: bash
      run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund --prefix "$ACTION_ROOT"
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
    - name: Publish the release
      shell: bash
      run: node "$ACTION_ROOT/lib/publish.mjs"
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
        EXPECTED_RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_MODE: ${{ inputs.mode }}
        RELEASE_TAG_FORMAT: ${{ inputs.tag-format }}
        RELEASE_FORCE: ${{ inputs.force }}
        RELEASE_ASSETS: ${{ inputs.assets }}
        GITHUB_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
    - name: Record the release
      if: inputs.gateway-url != '' && inputs.mode == 'release'
      continue-on-error: true
      uses: please-behave/action@0d9c81df1e374603a643223fb1c82c97c9688dc4 # v1.10.0
      with:
        version: v0.24.0
        run: 'false'
        gateway-url: ${{ inputs.gateway-url }}
        release-version: ${{ inputs.version }}
        release-commit: ${{ inputs.source-sha }}
