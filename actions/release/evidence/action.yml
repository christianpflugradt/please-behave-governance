name: Release candidate evidence
description: Record the hashes of a release candidate and upload them, or download all recorded evidence and verify it before publication
inputs:
  operation:
    description: "`record` after the candidate was built and verified, which also uploads the evidence; `verify` before publication, which first downloads the evidence of every target"
    required: true
  version:
    description: The version planned by the plan action
    required: true
  target:
    description: The candidate target to record, one of the targets of the policy file; not needed for `verify`
    default: ''
  policy:
    description: The repository's policy file with the artifact `root` and the `targets` with their file lists
    default: .github/release-artifacts.json
runs:
  using: composite
  steps:
    - name: Download the evidence of all targets
      if: inputs.operation == 'verify'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
        path: release-evidence
        merge-multiple: true
    - name: Run the evidence operation
      shell: bash
      run: python3 -B "$ACTION_ROOT/lib/release_evidence.py" "$OPERATION"
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
        OPERATION: ${{ inputs.operation }}
        EXPECTED_RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_TARGET: ${{ inputs.target }}
        RELEASE_ARTIFACTS_POLICY: ${{ inputs.policy }}
    - name: Upload the evidence of this target
      if: inputs.operation == 'record'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target }}
        path: release-evidence/
        if-no-files-found: error
        retention-days: 7
