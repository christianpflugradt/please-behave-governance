name: Publish image
description: Copy the verified candidate images unchanged to the GitHub Container Registry and publish the planned release without files
inputs:
  version:
    description: The version planned by the plan action
    required: true
  force:
    description: Must equal the value given to the plan action
    default: 'false'
runs:
  using: composite
  steps:
    - name: Read the images of the candidate
      id: images
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
      run: |
        python3 - >> "$GITHUB_OUTPUT" <<'PY'
        import json, os
        images = json.load(open("dist/metadata.json"))["images"]
        if len(images) > 4:
            raise SystemExit("At most four images can be attested per release")
        print("names<<RELEASE_IMAGE_NAMES_END", *images, "RELEASE_IMAGE_NAMES_END", sep="\n")
        for number, (name, receipt) in enumerate(images.items(), 1):
            print(f"subject_{number}=ghcr.io/{os.environ['OWNER'].lower()}/{name}")
            print(f"digest_{number}={receipt['index_digest']}")
        PY
    - name: Install the release tooling
      shell: bash
      run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund --prefix "$ACTION_ROOT"
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
    - name: Publish the images and the release
      shell: bash
      run: node "$ACTION_ROOT/lib/publish.mjs"
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
        EXPECTED_RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_FORCE: ${{ inputs.force }}
        RELEASE_IMAGES: ${{ steps.images.outputs.names }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
    - name: Attest the first published image
      if: steps.images.outputs.subject_1 != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.images.outputs.subject_1 }}
        subject-digest: ${{ steps.images.outputs.digest_1 }}
        push-to-registry: true
        create-storage-record: false
    - name: Attest the second published image
      if: steps.images.outputs.subject_2 != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.images.outputs.subject_2 }}
        subject-digest: ${{ steps.images.outputs.digest_2 }}
        push-to-registry: true
        create-storage-record: false
    - name: Attest the third published image
      if: steps.images.outputs.subject_3 != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.images.outputs.subject_3 }}
        subject-digest: ${{ steps.images.outputs.digest_3 }}
        push-to-registry: true
        create-storage-record: false
    - name: Attest the fourth published image
      if: steps.images.outputs.subject_4 != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.images.outputs.subject_4 }}
        subject-digest: ${{ steps.images.outputs.digest_4 }}
        push-to-registry: true
        create-storage-record: false
