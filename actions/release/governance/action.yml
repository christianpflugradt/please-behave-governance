name: Release governance
description: Verify the repository at the release execution point of Please Behave and upload the report
inputs:
  target:
    description: Candidate target appended to the report name; needed when several candidate jobs of a matrix upload a report
    default: ''
runs:
  using: composite
  steps:
    - name: Verify the repository at the release point
      uses: please-behave/action@9a184e405e62a79154989de1e54c54869180751b # v1.5.0
      with:
        install: 'false'
        sync: 'true'
        execution-point: release
        summary: 'true'
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Upload the governance report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.target && format('-{0}', inputs.target) || '' }}
        path: .please/reports/last.json
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
