name: Export image candidate
description: Verify the candidate image archives of a release and write a receipt bound to the version, source and workflow run
inputs:
  version:
    description: The version planned by the plan action
    required: true
  images:
    description: Newline-separated image names; the candidate was built into dist/<name>.tar as an OCI archive for linux/amd64 and linux/arm64 with the OCI labels version (v<version>) and revision, provenance and SBOM
    required: true
runs:
  using: composite
  steps:
    - name: Verify the candidate images and write the receipt
      shell: bash
      run: python3 -B "$ACTION_ROOT/lib/release_image.py" export
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
        EXPECTED_RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_IMAGES: ${{ inputs.images }}
