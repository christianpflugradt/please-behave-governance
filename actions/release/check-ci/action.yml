name: Check release CI
description: Verify that CI succeeded for the exact commit being released, within one trusted workflow run
inputs:
  required-jobs:
    description: Newline-separated names of the CI jobs that must have succeeded, including every matrix entry
    default: Check
runs:
  using: composite
  steps:
    - name: Verify the CI run of the source commit
      shell: bash
      run: python3 -B "$ACTION_ROOT/lib/check_release_ci.py"
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
        CI_REQUIRED_JOBS: ${{ inputs.required-jobs }}
        GITHUB_TOKEN: ${{ github.token }}
